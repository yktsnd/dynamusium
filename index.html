      property="og:image:alt"
      content="The DynaMusium wordmark beside a glowing Lorenz attractor suspended in a dark museum hall opening onto a starlit sea."
    />
    <!--
      Without an explicit card type, X renders a shared link as a bare text
      stub rather than the image above, which is most of the reason anyone
      clicks. Twitter tags are read by Slack, Discord, and several readers
      too, so they are not X-specific.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DynaMusium — Museum of Dynamic Systems" />
    <meta
      name="twitter:description"
      content="Thirty sourced interactive models presented as a museum collection across motion, matter, life, Earth, and the cosmos."
    />
    <meta name="twitter:image" content="https://yktsnd.github.io/dynamusium/og-dynamusium.png" />
    <meta
      name="twitter:image:alt"
      content="The DynaMusium wordmark beside a glowing Lorenz attractor suspended in a dark museum hall opening onto a starlit sea."
    />
    <link rel="canonical" href="https://yktsnd.github.io/dynamusium/" />
    <title>DynaMusium — Museum of Dynamic Systems</title>
  </head>
